      size: 360530
      isexec: true
  preprocess_to_staging:
    cmd: "python src/transform/preprocess_to_staging.py --bucket_raw raw --sp500_file
      sp500_combined.csv --db_host localhost --db_user root --db_password root --endpoint-url
      http://localhost:4566 --horizon 1 && date -u +\"%Y-%m-%dT%H:%M:%SZ\" > data/.pipeline_state/staging_ready.txt\n"
    deps:
    - path: data/.pipeline_state/market_mood_ready.txt

schema: '2.0'
stages:
  unpack_to_raw:
    cmd: "export AWS_ACCESS_KEY_ID=test AWS_SECRET_ACCESS_KEY=test AWS_DEFAULT_REGION=us-east-1
      && test -f data/kaggle_stocks/SP500_Historical_Data.csv && python scripts/create_raw_bucket.py
      --endpoint-url http://localhost:4566 --bucket raw && python build/unpack_to_raw.py
      --input_dir data/kaggle_stocks --input_file data/kaggle_stocks/SP500_Historical_Data.csv
      --bucket_name raw --output_file_name sp500_combined.csv --endpoint-url http://localhost:4566
      --local-output data/raw_snapshot/sp500_combined.csv\n"
    deps:
    - path: build/unpack_to_raw.py
      hash: md5
      md5: 9c3486dca558bcee935454e03309b91a
      size: 4947
    - path: data/kaggle_stocks/SP500_Historical_Data.csv
      hash: md5
      md5: 85f54581466575fad013033a04ee2916
      size: 93611
    - path: params.yaml
      hash: md5
      md5: 35f3f00031e61ae40af1f39fb6105adc
      size: 606
    - path: scripts/create_raw_bucket.py
      hash: md5
      md5: 13135ddbc75d3d3ca75303125fac5730
      size: 1624
    outs:
    - path: data/raw_snapshot/sp500_combined.csv
      hash: md5
      md5: fcbfb9b4d03b3581ce7dd2daadb5dd66
      size: 91261
      isexec: true
  fetch_market_mood:
    cmd: "export AWS_ACCESS_KEY_ID=test AWS_SECRET_ACCESS_KEY=test AWS_DEFAULT_REGION=us-east-1
      && python src/ingestion/market_api.py --bucket_name raw --endpoint-url http://localhost:4566
      --period max --start_date 2015-01-01 --output-path data/raw_snapshot/market_mood.json\n"
    deps:
    - path: data/raw_snapshot/sp500_combined.csv
      hash: md5
      md5: fcbfb9b4d03b3581ce7dd2daadb5dd66
      size: 91261
    - path: params.yaml

schema: '2.0'
stages:
  unpack_to_raw:
    cmd: "export AWS_ACCESS_KEY_ID=test AWS_SECRET_ACCESS_KEY=test AWS_DEFAULT_REGION=us-east-1
      && mkdir -p data/.pipeline_state && test -f data/kaggle_stocks/SP500_Historical_Data.csv
      && python scripts/create_raw_bucket.py --endpoint-url http://localhost:4566
      --bucket raw && python build/unpack_to_raw.py --input_dir data/kaggle_stocks
      --input_file data/kaggle_stocks/SP500_Historical_Data.csv --bucket_name raw
      --output_file_name sp500_combined.csv --endpoint-url http://localhost:4566 &&
      date -u +\"%Y-%m-%dT%H:%M:%SZ\" > data/.pipeline_state/raw_ready.txt\n"
    deps:
    - path: build/unpack_to_raw.py
      hash: md5
      md5: 0d6acc530247e913efa48336a0eadd94
      size: 4570
    - path: data/.pipeline_state/source_ready.txt
      hash: md5
      md5: f5ec1174a306482ed5578a0c48b9de4a
      size: 21
    - path: data/kaggle_stocks/SP500_Historical_Data.csv
      hash: md5
      md5: a0f2a6ac2d0cae50ab3fa2bf70c68ee4
      size: 142643767
    - path: params.yaml
      hash: md5
      md5: aa19534d81ade9569bfd350f1d1c6aff
      size: 580
    - path: scripts/create_raw_bucket.py
      hash: md5
      md5: 13135ddbc75d3d3ca75303125fac5730
      size: 1624
    outs:
    - path: data/.pipeline_state/raw_ready.txt
      hash: md5
      md5: 345623517d12a16d4137df73fc69f2d6
      size: 21
      isexec: true
  fetch_market_mood:
    cmd: "export AWS_ACCESS_KEY_ID=test AWS_SECRET_ACCESS_KEY=test AWS_DEFAULT_REGION=us-east-1
      && python src/ingestion/market_api.py --bucket_name raw --endpoint-url http://localhost:4566
      --period max --start_date 2015-01-01 && date -u +\"%Y-%m-%dT%H:%M:%SZ\" > data/.pipeline_state/market_mood_ready.txt\n"
    deps:
    - path: data/.pipeline_state/raw_ready.txt

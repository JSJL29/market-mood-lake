vars:
  - params.yaml

stages:
  acquire_historical_source:
    cmd: >
      python scripts/acquire_historical_data.py
      --destination ${source_csv}
    deps:
      - scripts/acquire_historical_data.py
      - params.yaml
    outs:
      - ${source_csv}

  unpack_to_raw:
    cmd: >
      export AWS_ACCESS_KEY_ID=test AWS_SECRET_ACCESS_KEY=test AWS_DEFAULT_REGION=us-east-1 &&
      test -f ${source_csv} &&
      python scripts/create_raw_bucket.py
      --endpoint-url ${endpoint_url}
      --bucket ${bucket_raw} &&
      python build/unpack_to_raw.py
      --input_dir ${input_dir}
      --input_file ${source_csv}
      --bucket_name ${bucket_raw}
      --output_file_name ${sp500_file}
      --endpoint-url ${endpoint_url}
      --local-output data/raw_snapshot/${sp500_file}
    deps:
      - build/unpack_to_raw.py
      - scripts/create_raw_bucket.py
      - ${source_csv}
      - params.yaml
    outs:
      - data/raw_snapshot/${sp500_file}

  fetch_market_mood:
    cmd: >
      export AWS_ACCESS_KEY_ID=test AWS_SECRET_ACCESS_KEY=test AWS_DEFAULT_REGION=us-east-1 &&
      python src/ingestion/market_api.py
      --bucket_name ${bucket_raw}
      --endpoint-url ${endpoint_url}
      --period ${vix_period}
      --start_date ${market_start_date}
      --output-path data/raw_snapshot/market_mood.json
    deps:
      - src/ingestion/market_api.py
      - data/raw_snapshot/${sp500_file}
      - params.yaml
    outs:
      - data/raw_snapshot/market_mood.json

  preprocess_to_staging_xs:
    cmd: >
      export AWS_ACCESS_KEY_ID=test AWS_SECRET_ACCESS_KEY=test AWS_DEFAULT_REGION=us-east-1 &&
      python -m src.transform.preprocess_to_staging_xs
      --bucket_raw ${bucket_raw}
      --stocks_file ${sp500_file}
      --db_host ${db_host}
      --db_user ${db_user}
      --db_password ${db_password}
      --endpoint-url ${endpoint_url}
      --horizon ${horizon}
      --max_tickers ${xs_max_tickers} &&
      python scripts/snapshot_databases.py
      --kind mysql
      --mysql-host ${db_host}
      --mysql-user ${db_user}
      --mysql-password ${db_password}
      --table market_data_xs
      --output data/versioned_snapshots/market_data_xs.csv.gz
    deps:
      - src/transform/preprocess_to_staging.py
      - src/transform/preprocess_to_staging_xs.py
      - scripts/snapshot_databases.py
      - data/raw_snapshot/${sp500_file}
      - data/raw_snapshot/market_mood.json
      - params.yaml
    outs:
      - data/versioned_snapshots/market_data_xs.csv.gz

  process_to_curated_xs:
    cmd: >
      python -m src.transform.process_to_curated_xs
      --mysql_host ${db_host}
      --mysql_user ${db_user}
      --mysql_password ${db_password}
      --mongo_uri ${mongo_uri}
      --window_size ${window_size}
      --max_sequences_per_ticker ${xs_max_sequences_per_ticker} &&
      python scripts/snapshot_databases.py
      --kind mongo
      --mongo-uri ${mongo_uri}
      --collection market_sequences_xs
      --output data/versioned_snapshots/market_sequences_xs.jsonl.gz
    deps:
      - src/transform/process_to_curated_xs.py
      - scripts/snapshot_databases.py
      - data/versioned_snapshots/market_data_xs.csv.gz
      - params.yaml
    outs:
      - data/versioned_snapshots/market_sequences_xs.jsonl.gz
